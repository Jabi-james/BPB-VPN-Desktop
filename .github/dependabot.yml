version: 2
updates:
  # Keep Go protocol engines and their transitive dependency graphs current.
  # Major upgrades remain separate PRs so compatibility changes are reviewable.
  - package-ecosystem: gomod
    directory: /xray
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /psiphon
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /networking
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /scanner
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Flutter packages, the Windows-specific Flutter plugins, and Dart tooling.
  - package-ecosystem: pub
    directory: /
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the bundled Cloudflare Worker minifier current.
  - package-ecosystem: npm
    directory: /worker
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pin GitHub Actions to current compatible releases through reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
