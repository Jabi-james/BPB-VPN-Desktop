version: 2
updates:
  # BPB-managed Xray and Psiphon versions follow upstream BPB source updates.
  # Keep independent Go dependency PRs only for our desktop networking/scanner modules.
  - package-ecosystem: gomod
    directory: /networking
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /scanner
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      go-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Flutter packages, the Windows-specific Flutter plugins, and Dart tooling.
  - package-ecosystem: pub
    directory: /
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Keep the bundled Cloudflare Worker minifier current.
  - package-ecosystem: npm
    directory: /worker
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Pin GitHub Actions to current compatible releases through reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    target-branch: desktop/bootstrap
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
