name: Web UI Preview

on:
  push:
    branches:
      - feature/web-ui-preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ui-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Use isolated web-preview dependencies
        run: cp pubspec.web-preview.yaml pubspec.yaml
      - name: Resolve preview dependencies
        run: flutter pub get
      - name: Analyze preview entry point
        run: dart analyze lib/web_preview.dart
      - name: Build web preview
        run: flutter build web --release --target=lib/web_preview.dart --base-href "/"
      - name: Upload web preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: bpb-vpn-web-preview
          path: build/web
          if-no-files-found: error
          retention-days: 14
