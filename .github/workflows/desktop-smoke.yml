# Re-run after correcting Windows VERSIONINFO metadata validation
name: Desktop smoke build

on:
  push:
    branches: [desktop/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Cache Flutter/Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Generate the missing Flutter desktop runner
        run: flutter create --platforms=${{ matrix.platform }} --project-name=bpb .

      - name: Set up Node.js for SVG icon rendering
        if: matrix.platform == 'windows'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate BPB app icons
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          npm install --no-save --no-package-lock @resvg/resvg-js
          python -m pip install --disable-pip-version-check --quiet pillow
          node scripts/render_app_icon.mjs
          python scripts/generate_app_icons.py

      - name: Set Windows executable metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        run: pwsh -File scripts/set_windows_metadata.ps1

      - name: Set BPB VPN Windows identity and compact window
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $path = "windows/runner/main.cpp"
          $source = Get-Content $path -Raw
          $source = $source.Replace('Win32Window::Size size(1280, 720);', 'Win32Window::Size size(680, 656);')
          $adminHelper = @'
          #pragma comment(lib, "Advapi32.lib")
          bool IsBpbAdministrator() {
            BOOL isAdmin = FALSE;
            PSID adminGroup = nullptr;
            SID_IDENTIFIER_AUTHORITY authority = SECURITY_NT_AUTHORITY;
            if (AllocateAndInitializeSid(&authority, 2, SECURITY_BUILTIN_DOMAIN_RID,
                DOMAIN_ALIAS_RID_ADMINS, 0, 0, 0, 0, 0, 0, &adminGroup)) {
              CheckTokenMembership(nullptr, adminGroup, &isAdmin);
              FreeSid(adminGroup);
            }
            return isAdmin == TRUE;
          }
          '@
          $source = [regex]::Replace($source, '(?m)^int APIENTRY',
            ($adminHelper + [Environment]::NewLine + 'int APIENTRY'), 1)
          $source = $source.Replace('if (!window.Create(L"bpb", origin, size))',
            'const wchar_t* window_title = IsBpbAdministrator() ? L"BPB VPN - v.1.3.0 - ADMIN" : L"BPB VPN - v.1.3.0";' + [Environment]::NewLine + '  if (!window.Create(window_title, origin, size))')
          if ($source -notmatch 'Win32Window::Size size\(680, 656\);' -or $source -notmatch 'bool IsBpbAdministrator\(' -or $source -notmatch 'BPB VPN - v.1.3.0') {
            throw "Could not apply BPB VPN window identity/size patch to $path"
          }
          Set-Content -Path $path -Value $source -Encoding utf8
          $cmake = "windows/CMakeLists.txt"
          $cmakeSource = Get-Content $cmake -Raw
          $cmakeUpdated = $cmakeSource -replace 'set\(BINARY_NAME "bpb"\)', 'set(BINARY_NAME "BPB-VPN")'
          if ($cmakeUpdated -eq $cmakeSource) { throw "Could not rename the Windows executable in $cmake" }
          Set-Content -Path $cmake -Value $cmakeUpdated -Encoding utf8


      - name: Resolve dependencies
        run: flutter pub get

      - name: Install Node.js for Cloudflare Worker bundling
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the bundled Cloudflare Worker asset
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npm run minify

      - name: Fetch and verify Xray routing geo assets
        shell: bash
        run: bash scripts/fetch_geo.sh

      - name: Fetch Tor bridges required by the setup wizard
        shell: bash
        run: bash scripts/fetch_tor_bridges.sh

      # flutter create generates a sample MyApp widget test that does not
      # match BPB's BpbApp entry point. Remove only that generated template.
      - name: Remove generated Flutter sample test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run project tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "No project test files yet; skipping test suite."
          fi

      - name: Compile desktop shell
        run: flutter build ${{ matrix.platform }} --release --no-pub --dart-define=BPB_APP_VERSION=1.3.0

      - name: Apply and verify Windows executable resources
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = "build/windows/x64/runner/Release/BPB-VPN.exe"
          if (!(Test-Path $app)) { throw "Built BPB executable not found: $app" }
          $tool = Join-Path $env:RUNNER_TEMP "rcedit-x64.exe"
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $tool
          $expectedHash = "3e7801db1a5edbec91b49a24a094aad776cb4515488ea5a4ca2289c400ea de2a".Replace(" ", "")
          $actualHash = (Get-FileHash $tool -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) { throw "rcedit SHA-256 mismatch: $actualHash" }
          & $tool $app --set-icon "windows/runner/resources/app_icon.ico" --set-product-version "1.3.0" --set-version-string "ProductName" "BPB VPN Desktop" --set-version-string "ProductVersion" "1.3.0" --set-version-string "CompanyName" "NotDev" --set-version-string "FileDescription" "" --set-version-string "FileVersion" ""
          if ($LASTEXITCODE -ne 0) { throw "rcedit failed with exit code $LASTEXITCODE" }
          Write-Host "Applied BPB icon and VERSIONINFO strings to the compiled executable."

      - name: Verify Windows executable identity and icon metadata
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $app = "build/windows/x64/runner/Release/BPB-VPN.exe"
          if (!(Test-Path $app)) { throw "Built BPB executable not found: $app" }
          $info = (Get-Item $app).VersionInfo
          $expected = @{
            ProductName = "BPB VPN Desktop"
            ProductVersion = "1.3.0"
            CompanyName = "NotDev"
          }
          foreach ($field in $expected.Keys) {
            $actual = [string]$info.$field
            if ($actual -ne $expected[$field]) { throw "EXE metadata mismatch for $field. Expected '$($expected[$field])', got '$actual'." }
          }
          foreach ($field in @("Comments", "FileDescription", "FileVersion")) {
            $actual = [string]$info.$field
            if (![string]::IsNullOrWhiteSpace($actual)) { throw "EXE metadata field $field should be empty, got '$actual'." }
          }
          Write-Host "Verified BPB EXE metadata: ProductName, ProductVersion and CompanyName; unwanted fields are empty."


      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache-dependency-path: xray/go.sum

      - name: Build BPB native helpers
        shell: bash
        run: |
          cd xray
          if [ "${{ matrix.platform }}" = "windows" ]; then
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/windows/x64/runner/Release/bpb_scanner.exe ./cmd/bpb-scanner
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/windows/x64/runner/Release/bpb_core.exe ./cmd/bpb-desktop
            mkdir -p ../build/windows/x64/runner/Release/assets
            cp ../android/app/src/main/assets/geoip.dat ../build/windows/x64/runner/Release/assets/geoip.dat
            cp ../android/app/src/main/assets/geosite.dat ../build/windows/x64/runner/Release/assets/geosite.dat
            cp ../windows/runner/resources/app_icon.ico ../build/windows/x64/runner/Release/bpb_tray.ico
            cp ../scripts/BPB-VPN-Clean-Start.bat ../build/windows/x64/runner/Release/BPB-VPN-Clean-Start.bat
          else
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/linux/x64/release/bundle/bpb_scanner ./cmd/bpb-scanner
          fi

      - name: Build the Windows Psiphon exit
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $env:GOTOOLCHAIN = "go1.26.9"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          go version
          Push-Location psiphon
          try {
            go build -trimpath -buildvcs=false -ldflags="-s -w" -o ../build/windows/x64/runner/Release/bpb_psiphon.exe .
          } finally {
            Pop-Location
          }
          if (!(Test-Path "build/windows/x64/runner/Release/bpb_psiphon.exe")) { throw "Psiphon executable was not produced" }

      - name: Fetch and verify the official Tor Windows Expert Bundle
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "16.0.1"
          $name = "tor-expert-bundle-windows-x86_64-$version.tar.gz"
          $base = "https://dist.torproject.org/torbrowser/$version"
          $archive = Join-Path $env:RUNNER_TEMP $name
          Invoke-WebRequest -Uri "$base/$name" -OutFile $archive
          $expected = "9eed3c3ff1fe43df034ce360196c9ec95472560d77ff55614d0cd5120edea27b"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Tor Expert Bundle SHA-256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP "tor-expert"
          New-Item -ItemType Directory -Force $extract | Out-Null
          tar -xzf $archive -C $extract
          $tor = Join-Path $extract "tor/tor.exe"
          $pt = Join-Path $extract "tor/pluggable_transports/lyrebird.exe"
          $geoip = Join-Path $extract "data/geoip"
          $geoip6 = Join-Path $extract "data/geoip6"
          foreach ($file in @($tor, $pt, $geoip, $geoip6)) {
            if (!(Test-Path $file)) { throw "Expected Tor bundle file missing: $file" }
          }
          $release = "build/windows/x64/runner/Release"
          $torDir = Join-Path $release "tor"
          New-Item -ItemType Directory -Force $torDir | Out-Null
          Copy-Item $tor (Join-Path $torDir "tor.exe")
          Copy-Item $pt (Join-Path $torDir "lyrebird.exe")
          Copy-Item $geoip (Join-Path $torDir "geoip")
          Copy-Item $geoip6 (Join-Path $torDir "geoip6")
          $ptConfig = Join-Path $extract "tor/pluggable_transports/pt_config.json"
          if (!(Test-Path $ptConfig)) { throw "Expected Tor pluggable transport config missing: $ptConfig" }
          Copy-Item $ptConfig (Join-Path $torDir "pt_config.json")
          Copy-Item "android/app/src/main/assets/psiphon_config.json" (Join-Path $release "psiphon_config.json")
          if (!(Test-Path (Join-Path $release "psiphon_config.json"))) { throw "Psiphon configuration asset missing" }

      - name: Fetch and verify the official Aether Windows core
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $version = "v2.4.0"
          $name = "aether-windows-x86_64.zip"
          $archive = Join-Path $env:RUNNER_TEMP $name
          $url = "https://github.com/CluvexStudio/Aether/releases/download/$version/$name"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = "21b1444628d37121e873878e2eddd7932215418af1a2a12470caee5809026f1a"
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Aether archive SHA-256 mismatch: $actual" }
          $extract = Join-Path $env:RUNNER_TEMP "aether"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $binary = Join-Path $extract "aether.exe"
          $pt = Join-Path $extract "pt"
          $licenses = Join-Path $extract "LICENSES"
          foreach ($path in @($binary, $pt, $licenses)) {
            if (!(Test-Path $path)) { throw "Expected Aether bundle item missing: $path" }
          }
          $release = "build/windows/x64/runner/Release"
          $dest = Join-Path $release "aether"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item $binary (Join-Path $dest "aether.exe")
          Copy-Item -Recurse $pt (Join-Path $dest "pt")
          Copy-Item -Recurse $licenses (Join-Path $dest "LICENSES")
          @"
          Aether v2.4.0
          Source: https://github.com/CluvexStudio/Aether
          License: AGPL-3.0-only
          Third-party license texts and notices are in the LICENSES directory.
          "@ | Set-Content -Path (Join-Path $dest "NOTICE.txt") -Encoding utf8
          if (!(Test-Path (Join-Path $dest "aether.exe"))) { throw "Aether executable was not packaged" }
          if (!(Test-Path (Join-Path $dest "LICENSES"))) { throw "Aether license bundle was not packaged" }

      - name: Fetch and verify the official Wintun runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wintun-0.14.1.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            throw "Wintun archive SHA-256 mismatch: $hash"
          }
          $extract = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $release = "build/windows/x64/runner/Release"
          Copy-Item (Join-Path $extract "wintun/bin/amd64/wintun.dll") (Join-Path $release "wintun.dll")
          Copy-Item (Join-Path $extract "wintun/LICENSE.txt") (Join-Path $release "LICENSE-Wintun.txt")

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = (Resolve-Path "build/windows/x64/runner/Release").Path
          $app = Join-Path $release "BPB-VPN.exe"
          if (!(Test-Path $app)) { throw "Expected Windows app executable not found: $app" }
          if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source
          $script = @'
          #define MyAppName "BPB VPN"
          #define MyAppVersion "1.3.0"
          #define SourceDir "build/windows/x64/runner/Release"
          [Setup]
          AppId={{D38C7B2A-3D9E-4C70-9F17-8B0D5D91B121}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppPublisher=BPB VPN
          DefaultDirName={autopf}\BPB VPN
          DefaultGroupName=BPB VPN
          OutputDir=installer-output
          OutputBaseFilename=BPB-VPN-Setup-v{#MyAppVersion}
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          SetupIconFile=windows\runner\resources\app_icon.ico
          VersionInfoProductName=BPB VPN Desktop
          VersionInfoProductVersion=1.3.0
          VersionInfoTextVersion=1.3.0
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          PrivilegesRequired=lowest
          UninstallDisplayIcon={app}\BPB-VPN.exe
          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop shortcut"; GroupDescription: "Additional icons:"
          [Files]
          Source: "{#SourceDir}\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs
          [Icons]
          Name: "{group}\BPB VPN"; Filename: "{app}\BPB-VPN.exe"
          Name: "{autodesktop}\BPB VPN"; Filename: "{app}\BPB-VPN.exe"; Tasks: desktopicon
          [Run]
          Filename: "{app}\BPB-VPN.exe"; Description: "Launch BPB VPN"; Flags: postinstall nowait skipifsilent shellexec
          '@
          New-Item -ItemType Directory -Force "installer-output" | Out-Null
          Set-Content -Path "BPB-VPN.iss" -Value $script -Encoding utf8
          & $iscc "BPB-VPN.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }
          if (!(Test-Path "installer-output/BPB-VPN-Setup-v1.3.0.exe")) { throw "Installer output missing" }

      - name: Package Windows portable application
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bpb-windows-portable
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          compression-level: 0

      - name: Package Windows installer
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: bpb-windows-installer
          path: installer-output/*.exe
          if-no-files-found: error

