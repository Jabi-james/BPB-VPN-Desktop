name: Desktop smoke build

on:
  push:
    branches: [desktop/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read


jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Cache Flutter/Dart package dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Generate the missing Flutter desktop runner
        run: flutter create --platforms=${{ matrix.platform }} --project-name=bpb .

      - name: Set BPB VPN Windows identity and compact window
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $path = "windows/runner/main.cpp"
          $source = Get-Content $path -Raw
          $source = $source.Replace('Win32Window::Size size(1280, 720);', 'Win32Window::Size size(680, 656);')
          $adminHelper = @'
          #pragma comment(lib, "Advapi32.lib")
          bool IsBpbAdministrator() {
            BOOL isAdmin = FALSE;
            PSID adminGroup = nullptr;
            SID_IDENTIFIER_AUTHORITY authority = SECURITY_NT_AUTHORITY;
            if (AllocateAndInitializeSid(&authority, 2, SECURITY_BUILTIN_DOMAIN_RID,
                DOMAIN_ALIAS_RID_ADMINS, 0, 0, 0, 0, 0, 0, &adminGroup)) {
              CheckTokenMembership(nullptr, adminGroup, &isAdmin);
              FreeSid(adminGroup);
            }
            return isAdmin == TRUE;
          }
          '@
          $source = $source.Replace('}  // namespace' + [Environment]::NewLine + [Environment]::NewLine + 'int APIENTRY',
            '}  // namespace' + [Environment]::NewLine + [Environment]::NewLine + $adminHelper + [Environment]::NewLine + 'int APIENTRY')
          $source = $source.Replace('window.Create(L"bpb", origin, size)',
            'window.Create((IsBpbAdministrator() ? std::wstring(L"BPB VPN - v.1.2.1 - ADMIN") : std::wstring(L"BPB VPN - v.1.2.1")).c_str(), origin, size)')
          if ($source -notmatch 'Win32Window::Size size\(680, 656\);' -or $source -notmatch 'IsBpbAdministrator' -or $source -notmatch 'BPB VPN - v.1.2.1') {
            throw "Could not apply BPB VPN window identity/size patch to $path"
          }
          Set-Content -Path $path -Value $source -Encoding utf8
          $cmake = "windows/CMakeLists.txt"
          $cmakeSource = Get-Content $cmake -Raw
          $cmakeUpdated = $cmakeSource -replace 'set\(BINARY_NAME "bpb"\)', 'set(BINARY_NAME "BPB-VPN")'
          if ($cmakeUpdated -eq $cmakeSource) { throw "Could not rename the Windows executable in $cmake" }
          Set-Content -Path $cmake -Value $cmakeUpdated -Encoding utf8

      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - name: Install Node.js for Cloudflare Worker bundling
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the bundled Cloudflare Worker asset
        working-directory: worker
        run: |
          npm install --no-audit --no-fund
          npm run minify

      - name: Fetch and verify Xray routing geo assets
        shell: bash
        run: bash scripts/fetch_geo.sh

      - name: Fetch Tor bridges required by the setup wizard
        shell: bash
        run: bash scripts/fetch_tor_bridges.sh

      # flutter create generates a sample MyApp widget test that does not
      # match BPB's BpbApp entry point. Remove only that generated template.
      - name: Remove generated Flutter sample test
        shell: bash
        run: |
          if [ -f test/widget_test.dart ] && grep -q "MyApp" test/widget_test.dart; then
            rm test/widget_test.dart
          fi

      - name: Analyze Dart code
        run: flutter analyze --no-pub

      - name: Run project tests
        shell: bash
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "No project test files yet; skipping test suite."
          fi

      - name: Compile desktop shell
        run: flutter build ${{ matrix.platform }} --release --no-pub

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: xray/go.mod
          cache-dependency-path: xray/go.sum

      - name: Build BPB native helpers
        shell: bash
        run: |
          cd xray
          if [ "${{ matrix.platform }}" = "windows" ]; then
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/windows/x64/runner/Release/bpb_scanner.exe ./cmd/bpb-scanner
            GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/windows/x64/runner/Release/bpb_core.exe ./cmd/bpb-desktop
            mkdir -p ../build/windows/x64/runner/Release/assets
            cp ../android/app/src/main/assets/geoip.dat ../build/windows/x64/runner/Release/assets/geoip.dat
            cp ../android/app/src/main/assets/geosite.dat ../build/windows/x64/runner/Release/assets/geosite.dat
          else
            GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../build/linux/x64/release/bundle/bpb_scanner ./cmd/bpb-scanner
          fi

      - name: Fetch and verify the official Wintun runtime
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "wintun-0.14.1.zip"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {
            throw "Wintun archive SHA-256 mismatch: $hash"
          }
          $extract = Join-Path $env:RUNNER_TEMP "wintun"
          Expand-Archive -Path $archive -DestinationPath $extract -Force
          $release = "build/windows/x64/runner/Release"
          Copy-Item (Join-Path $extract "wintun/bin/amd64/wintun.dll") (Join-Path $release "wintun.dll")
          Copy-Item (Join-Path $extract "wintun/LICENSE.txt") (Join-Path $release "LICENSE-Wintun.txt")

      - name: Package desktop application
        uses: actions/upload-artifact@v4
        with:
          name: bpb-${{ matrix.platform }}-desktop
          path: |
            build/windows/x64/runner/Release/
            build/linux/x64/release/bundle/
