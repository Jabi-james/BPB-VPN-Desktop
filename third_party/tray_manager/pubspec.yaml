name: tray_manager
description: Local Windows tray_manager fork with correct native popup dismissal.
version: 0.5.3+1
homepage: https://github.com/leanflutter/tray_manager

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter
  menu_base: ^0.1.0
  path: ^1.8.0
  shortid: ^0.1.2

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: TrayManagerPlugin
