name: bpb
description: "BPB VPN interactive web UI preview."
publish_to: none
version: 1.3.0

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  material_symbols_icons: 4.2960.0
  shared_preferences: ^2.3.2

flutter:
  uses-material-design: true
  assets:
    - images/icon/bg.jpg
  fonts:
    - family: ClashGrotesk
      fonts:
        - asset: assets/fonts/ClashGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/ClashGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/ClashGrotesk-Semibold.ttf
          weight: 600
        - asset: assets/fonts/ClashGrotesk-Bold.ttf
          weight: 700
